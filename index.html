<!doctype html>
<html lang="en">
  <!-- Set the page name and mobile layout. -->
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list-check</title>
  </head>
  <body>
    <!-- Let visitors upload a CSV or try the sample list. -->
    <div id="app">
      <label for="file-input">Select a CSV file</label>
      <input type="file" id="file-input" accept=".csv">
      <button type="button" id="sample-button">Try it with a sample list</button>
      <p id="summary" aria-live="polite"></p>
      <!-- Show people who need a human check. -->
      <h2 id="review-heading">People to review</h2>
      <ul id="review-list" aria-labelledby="review-heading" aria-live="polite"></ul>
      <!-- Explain where the list is processed. -->
      <p id="privacy-note">Checked on your computer. Nothing was uploaded.</p>
    </div>
    <!-- Start the app. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
